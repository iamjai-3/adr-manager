[project]
name = "prompt-service"
version = "0.1.0"
description = "FastAPI service that wraps the Elsai Prompts SaaS SDK to serve ADR Manager system prompts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "elsai-prompts==1.0.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://elsai-core-package.optisolbusiness.com/root/elsai-prompts-sass/"
name = "elsai-saas"
explicit = true

[tool.uv.sources]
elsai-prompts = { index = "elsai-saas" }
